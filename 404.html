<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/fav.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="tailwind.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        accent: 'var(--color-accent)',
                        'accent-light': 'var(--color-accent-light)'
                    }
                }
            }
        };
    </script>
    <title>404 | Juicora</title>
    <style>
        :root, html[data-theme='light'] {
            color-scheme: light;
            --color-background: #FFFDF9;
            --color-primary-text: #3D271D;
            --color-secondary-text: #7C6053;
            --color-accent: #FF5E86;
            --color-accent-light: #A87C00;
            --color-border: #F3ECE3;
            --color-hover: #FFF5E6;
        }
        html[data-theme='dark'] {
            color-scheme: dark;
            --color-background: #0E0F12;
            --color-primary-text: #F3F4F6;
            --color-secondary-text: #9CA3AF;
            --color-accent: #FF5E86;
            --color-accent-light: #D4AF37;
            --color-border: #23272E;
            --color-hover: #1A1C20;
        }
        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--color-background);
            color: var(--color-primary-text);
            font-family: 'Outfit', sans-serif;
            transition: background .3s, color .3s;
        }
        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
        }
        .text-accent { color: var(--color-accent); }
        .border-theme { border-color: var(--color-border); }
        .btn-primary {
            background: linear-gradient(135deg, var(--color-accent), var(--color-accent-light));
            color: #fff;
            transition: .3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(255, 94, 134, .28);
        }
        .btn-outline {
            border: 2px solid var(--color-accent);
            color: var(--color-accent);
            transition: .3s ease;
        }
        .btn-outline:hover {
            background: var(--color-accent);
            color: #fff;
        }
        .glass {
            background: color-mix(in srgb, var(--color-background) 88%, transparent);
            border: 1px solid var(--color-border);
            box-shadow: 0 25px 70px rgba(0,0,0,.08);
            backdrop-filter: blur(14px);
        }
        .juice-logo {
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: color-mix(in srgb, var(--color-accent) 10%, transparent);
            border: 1px solid color-mix(in srgb, var(--color-accent) 20%, transparent);
        }
        .float { animation: float 4s ease-in-out infinite; }
        @keyframes float {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .orb {
            position: absolute;
            border-radius: 9999px;
            filter: blur(60px);
            pointer-events: none;
            opacity: .18;
        }
    </style>
</head>

<body class="antialiased min-h-screen flex flex-col">

    <!-- Simple single-page 404 header -->
    <header class="border-b border-theme bg-background/90 backdrop-blur-md">
        <nav class="max-w-7xl mx-auto px-5 sm:px-8 h-[76px] flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <div class="juice-logo">
                    <svg class="w-7 h-7" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M25 35L35 85C36 90 40 92 45 92H55C60 92 64 90 65 85L75 35Z"
                              fill="url(#juiceGrad)" stroke="var(--color-accent)" stroke-width="4" stroke-linejoin="round"/>
                        <path d="M20 35C20 25 80 25 80 35Z" fill="#fff"
                              stroke="var(--color-accent)" stroke-width="4" stroke-linejoin="round"/>
                        <path d="M50 25V10H65" stroke="var(--color-accent-light)" stroke-width="5"
                              stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="25" cy="45" r="12" fill="#FFA726" stroke="#fff" stroke-width="2"/>
                        <circle cx="25" cy="45" r="9" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="4 2"/>
                        <path d="M32 40L40 85" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".4"/>
                        <defs>
                            <linearGradient id="juiceGrad" x1="50" y1="90" x2="50" y2="35" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#FF9800"/>
                                <stop offset="100%" stop-color="var(--color-accent)"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <span class="text-2xl font-black tracking-tight text-accent">Juicora</span>
            </a>

            <div class="flex items-center gap-2">
                <button id="theme-toggle" aria-label="Toggle theme"
                    class="w-10 h-10 rounded-full flex items-center justify-center hover:text-accent transition text-primary-text">
                    <i id="theme-icon" class="fa-solid fa-sun text-lg"></i>
                </button>
                <button id="lang-toggle" aria-label="Toggle language direction"
                    class="w-10 h-10 rounded-full flex items-center justify-center hover:text-accent transition text-primary-text">
                    <i class="fa-solid fa-right-left text-base"></i>
                </button>
            </div>
        </nav>
    </header>

    <!-- Single 404 page -->
    <main class="relative flex-1 min-h-0 overflow-hidden flex items-center justify-center px-5 py-6 sm:py-8">
        <div class="orb w-72 h-72 bg-pink-400 -top-24 -left-24"></div>
        <div class="orb w-80 h-80 bg-yellow-400 -bottom-32 -right-24"></div>

        <section class="relative z-10 w-full max-w-4xl text-center max-h-full">
            <div class="glass rounded-[2rem] sm:rounded-[2.5rem] px-5 py-6 sm:px-10 sm:py-8 md:px-16">

                <div class="float inline-flex items-center justify-center w-16 h-16 sm:w-20 sm:h-20 rounded-full
                            bg-accent/10 border border-accent/20 mb-8">
                    <svg class="w-11 h-11 sm:w-14 sm:h-14" viewBox="0 0 100 100" fill="none"
                         xmlns="http://www.w3.org/2000/svg">
                        <path d="M25 35L35 85C36 90 40 92 45 92H55C60 92 64 90 65 85L75 35Z"
                              fill="url(#errorJuiceGrad)" stroke="var(--color-accent)" stroke-width="4"/>
                        <path d="M20 35C20 25 80 25 80 35Z" fill="#fff"
                              stroke="var(--color-accent)" stroke-width="4"/>
                        <path d="M50 25V10H65" stroke="var(--color-accent-light)" stroke-width="5"
                              stroke-linecap="round"/>
                        <circle cx="25" cy="45" r="11" fill="#FFA726" stroke="#fff" stroke-width="2"/>
                        <defs>
                            <linearGradient id="errorJuiceGrad" x1="50" y1="90" x2="50" y2="35" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#FF9800"/>
                                <stop offset="100%" stop-color="var(--color-accent)"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>

                <p class="text-accent font-bold uppercase tracking-[.25em] text-sm mb-4">
                    Freshly Lost
                </p>

                <h1 class="text-[5rem] sm:text-[7rem] md:text-[8rem] leading-none font-black tracking-tight">
                    404
                </h1>

                <h2 class="text-xl sm:text-3xl md:text-4xl font-bold mt-1 mb-3">
                    Oops! This page got squeezed out.
                </h2>

                <p class="text-[var(--color-secondary-text)] text-sm sm:text-base max-w-2xl mx-auto leading-relaxed">
                    Looks like the page you're looking for isn't on our menu.
                    Let's get you back to something fresh, vibrant, and delicious.
                </p>

                <div class="mt-5 flex flex-col sm:flex-row justify-center gap-3">
                    <a href="index.html"
                       class="btn-primary inline-flex items-center justify-center gap-2 px-7 py-3.5 rounded-xl font-bold">
                        <i class="fa-solid fa-house"></i>
                        Back to Home
                    </a>
                    <a href="menu.html"
                       class="btn-outline inline-flex items-center justify-center gap-2 px-7 py-3.5 rounded-xl font-bold">
                        <i class="fa-solid fa-glass-water"></i>
                        Explore Our Menu
                    </a>
                </div>

                <div class="mt-5 pt-4 border-t border-theme text-xs sm:text-sm text-[var(--color-secondary-text)]">
                    Need a fresh start?
                    <a href="contact.html" class="text-accent font-semibold hover:underline">Contact Juicora</a>
                </div>
            </div>

            <p class="mt-3 text-xs text-[var(--color-secondary-text)]">
                © 2026 Juicora. Freshly made for you.
            </p>
        </section>
    </main>

    <script>
        const html = document.documentElement;
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const langToggle = document.getElementById('lang-toggle');

        function applyTheme(theme) {
            html.dataset.theme = theme;
            html.classList.toggle('dark', theme === 'dark');
            themeIcon.className = theme === 'dark'
                ? 'fa-solid fa-moon text-lg'
                : 'fa-solid fa-sun text-lg';
        }

        applyTheme(localStorage.getItem('theme') || 'light');

        themeToggle.addEventListener('click', () => {
            const next = html.dataset.theme === 'light' ? 'dark' : 'light';
            localStorage.setItem('theme', next);
            applyTheme(next);
        });

        function applyDirection() {
            const rtl = localStorage.getItem('language') === 'ar';
            html.dir = rtl ? 'rtl' : 'ltr';
        }

        applyDirection();

        langToggle.addEventListener('click', () => {
            localStorage.setItem(
                'language',
                localStorage.getItem('language') === 'ar' ? 'en' : 'ar'
            );
            applyDirection();
        });
    </script>
</body>
</html>
